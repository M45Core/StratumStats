server {
    listen 80;
    listen [::]:80;
    server_name stratumstats.m45core.com;

    include /etc/nginx/snippets/stratumstats-security.conf;

    # Keep unauthenticated requests from tying up all Nginx workers. The app
    # independently enforces the 256 KiB ingest body limit.
    limit_conn stratumstats_per_ip 20;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 256k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/ingest {
        limit_req zone=stratumstats_ingest burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 256k;
        client_body_timeout 10s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
