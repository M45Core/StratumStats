# StratumStats-managed Bitcoin Core defaults.
# This node is intended for measurements, not wallet use.

server=1
disablewallet=1

# Retain roughly 10 GiB of block and undo files. Initial sync still downloads
# and validates the full chain. Remove this line before first sync for an
# archival node; changing back later requires downloading the chain again.
prune=10000

# Make outbound peer connections without opening an inbound listening port.
listen=0
discover=0
natpmp=0

# RPC stays on this machine and uses Bitcoin Core's per-session cookie.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=38332

# Reserved for local block/template corroboration by StratumStats.
zmqpubhashblock=tcp://127.0.0.1:38333
zmqpubrawblock=tcp://127.0.0.1:38334
zmqpubrawtx=tcp://127.0.0.1:38335
